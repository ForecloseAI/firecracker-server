# The operator's key is the only way in. Everything here is reachable ONLY from
# the host that runs this VM: each tap is a point-to-point /30, the host
# firewall has no DNAT and no PREROUTING, and guest-to-guest is dropped.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers agent

# Off deliberately, not for want of xauth -- that arrives anyway as a dependency
# of the X11 stack this image already installs. The person's screen is the one
# Chrome and the agent share on display :0, and it is reached over VNC with a
# capability URL; a second, unaudited path to the same display is not wanted.
X11Forwarding no

# Already the default, pinned deliberately: resolvconf.service points this guest
# at 8.8.8.8, so a reverse lookup of 172.16.x.x would leave the VM and stall
# every single login until it timed out.
UseDNS no

# AllowTcpForwarding is deliberately left at its default of yes. Chrome's
# DevTools port is bound to 127.0.0.1 inside the guest (chrome.service), so
# `ssh -L 9222:127.0.0.1:9222` is the only way to reach it from the host.
