[Service]
# This image ships NO ssh host keys: openssh's postinst generates them at build
# time, so keeping them would give every VM built from this image one identity
# -- the same trap /etc/machine-id is truncated for. They are deleted instead,
# and minted here on first boot onto the VM's own overlay.
#
# The empty assignment RESETS the inherited list. Drop-in ExecStartPre lines
# APPEND, so a bare addition would run after the packaged
# `ExecStartPre=/usr/sbin/sshd -t`, which exits non-zero when there are no host
# keys -- and the VM would boot healthy while refusing every connection.
#
# `ssh-keygen -A` generates only the key types that are missing, so this is a
# no-op from the second boot onward and needs no condition guarding it. A
# condition here would be one typo away from never generating keys at all.
#
# Deliberately not a separate Before=ssh.service unit: ordering does not pull a
# unit into a transaction, it only orders units already in one -- so a hand
# `systemctl restart ssh`, or a socket-activated start after boot has settled,
# would run sshd with no keys. ExecStartPre runs on every start, whatever
# triggered it.
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t

# The operator cannot ssh in to find out why ssh did not start. Mirrors
# agentd.service: the failure lands on the serial console, which the host
# captures into run/<id>/console.log.
StandardOutput=journal+console
StandardError=journal+console
