<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connected</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #fbfbfa; color: #1c1b19; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #171614; color: #efeeec; } }
  main { max-width: 22rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: 0; opacity: .7; }
  a { display: inline-block; margin-top: 1.5rem; color: inherit; }
</style>
<main>
  <h1>All set</h1>
  <p>You can go back to Autobots now &mdash; it will pick up where it left off.</p>
  <a href="autobots://apps/connected">Open Autobots</a>
</main>
<script>
  // The page takes no action beyond this: it holds no token, reads nothing and
  // writes nothing. On a phone the app is already listening for its own scheme
  // and this hands control straight back; anywhere else the link above is the
  // way home. Wrapped because a browser with no handler throws here.
  try { window.location.replace("autobots://apps/connected"); } catch (e) {}
</script>
