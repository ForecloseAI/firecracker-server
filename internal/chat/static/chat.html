<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cracked · chat</title>
<style>
  :root {
    --bg:#12141a; --panel:#191c24; --line:#2a2f3d; --fg:#d6dae4;
    --dim:#7c8598; --accent:#6ea8fe; --ok:#4ec9a0; --warn:#e8c05a;
    --bad:#e06c75; --idle:#8b93a5;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; background:var(--bg);
    color:var(--fg); font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  a { color:var(--accent); }

  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:14px; letter-spacing:.09em; text-transform:uppercase; }
  #state { font-weight:600; letter-spacing:.06em; }
  #beat { color:var(--dim); flex:1; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .s-idle{color:var(--idle)} .s-working{color:var(--warn)} .s-ready{color:var(--ok)}
  .s-bad{color:var(--bad)} .s-waiting{color:var(--accent)}

  #banner { display:none; padding:10px 14px; border-bottom:1px solid var(--line);
    background:#20242e; }
  #banner.show { display:block; }
  #banner button, .card button { background:var(--accent); border:0; border-radius:4px;
    color:#0b0d12; padding:6px 12px; font:inherit; font-weight:600; cursor:pointer; margin-right:6px; }
  #banner button.ghost, .card button.bad { background:var(--bad); }
  .card button.warn { background:var(--warn); }

  #log { flex:1; overflow-y:auto; padding:14px; display:flex;
    flex-direction:column; gap:10px; }
  .msg { max-width:min(680px, 92%); padding:8px 11px; border-radius:6px;
    white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:#22304a; }
  .agent { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .beat { align-self:flex-start; color:var(--dim); font-size:12px; padding-left:2px; }
  .err { align-self:flex-start; color:var(--bad); }
  .turn { align-self:center; color:var(--dim); font-size:12px; }
  .card { align-self:flex-start; max-width:min(680px,92%); background:var(--panel);
    border:1px solid var(--warn); border-radius:6px; padding:11px; }
  .card .who { color:var(--dim); font-size:12px; margin-bottom:4px; }
  .card .answer { width:100%; margin:6px 0; padding:6px 8px; border-radius:4px;
    border:1px solid var(--line); background:var(--bg); color:inherit; font:inherit; resize:vertical; }
  .card .prompt { margin-bottom:6px; }
  .card .detail { color:var(--dim); font-size:12px; white-space:pre-wrap;
    overflow-wrap:anywhere; margin-bottom:9px; }
  .card.done { border-color:var(--line); opacity:.55; }

  footer { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line);
    background:var(--panel); }
  #text { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:4px;
    color:var(--fg); padding:9px 10px; font:inherit; resize:none; max-height:120px; }
  #text:focus { outline:2px solid var(--accent); outline-offset:1px; }
  #send { background:var(--accent); border:0; border-radius:4px; color:#0b0d12;
    padding:0 16px; font:inherit; font-weight:600; cursor:pointer; }
  #send:disabled { background:var(--line); color:var(--dim); cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>cracked</h1>
  <span id="vm" class="s-idle"></span>
  <span id="state" class="s-idle">connecting</span>
  <span id="beat"></span>
  <a href="/logout">sign out</a>
</header>
<div id="banner"></div>
<main id="log"></main>
<footer>
  <textarea id="text" rows="1" placeholder="ask the agent…" autocomplete="off"></textarea>
  <button id="send">send</button>
</footer>

<script>
"use strict";
const VM = new URLSearchParams(location.search).get("id") || "";
const $ = (id) => document.getElementById(id);
const log = $("log"), banner = $("banner"), beatEl = $("beat"), stateEl = $("state");

let es = null, working = false, startedAt = 0, ticker = null;
let errSince = 0, stopped = false;
const cards = new Map();

// Escape untrusted text: everything here comes from the guest.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

// Keep the newest message in view unless the user has scrolled up to read.
function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
function scroll(was) { if (was) log.scrollTop = log.scrollHeight; }

// Append a plain node to the transcript.
function add(cls, html) {
  const was = atBottom();
  const el = document.createElement("div");
  el.className = cls;
  el.innerHTML = html;
  log.appendChild(el);
  scroll(was);
  return el;
}

// Set the status word and its colour.
function setState(word, tone) {
  stateEl.textContent = word;
  stateEl.className = "s-" + tone;
}

// A ticking elapsed counter is the main proof-of-life during a long turn.
function startTimer() {
  startedAt = Date.now();
  clearInterval(ticker);
  ticker = setInterval(() => {
    const s = Math.round((Date.now() - startedAt) / 1000);
    setState("working · " + s + "s", "working");
  }, 1000);
  setState("working · 0s", "working");
}

// Stop the counter and show how long the turn took.
function stopTimer(ms) {
  clearInterval(ticker);
  ticker = null;
  const s = Math.round((ms || Date.now() - startedAt) / 1000);
  setState("done · " + s + "s", "ready");
  setTimeout(() => { if (!working) setState("idle", "idle"); }, 4000);
}

// Enable or disable sending. One turn at a time keeps the agent unconfused.
function setWorking(on) {
  working = on;
  $("send").disabled = on || stopped;
  $("send").textContent = on ? "working" : "send";
}

// Render one frame from the server.
function render(f) {
  if (f.kind === "say") return renderSay(f);
  if (f.kind === "beat") return renderBeat(f);
  if (f.kind === "state") return renderState(f);
  if (f.kind === "pending") return renderPending(f);
  if (f.kind === "resolved") return renderResolved(f);
  if (f.kind === "turn") { setWorking(false); stopTimer(f.duration_ms); add("turn", ""); return; }
  if (f.kind === "error") return void add("err", esc(f.text));
}

// A transcript turn from either side.
function renderSay(f) {
  add("msg " + (f.role === "user" ? "user" : "agent"), esc(f.text));
  if (f.role === "user") { setWorking(true); startTimer(); }
}

// A progress beat, derived from the tool name.
function renderBeat(f) {
  if (!f.label) return;
  beatEl.textContent = f.label;
  add("beat", "· " + esc(f.label));
}

// Session state pushed by the bridge.
function renderState(f) {
  if (f.state === "reconnecting") return setState("reconnecting", "warn");
  if (f.state === "working") { setWorking(true); if (!ticker) startTimer(); return; }
  if (f.state === "idle") { setWorking(false); clearInterval(ticker); ticker = null; setState("idle", "idle"); }
}

// A card the person has to answer.
function renderPending(f) {
  // The hub replays its whole set on reconnect, so the same card can arrive
  // again. Appending a second node would leave the older copy with buttons that
  // look live but answer an id the map no longer points at.
  if (cards.has(f.pending_id)) return;
  setWorking(false);
  setState("waiting for you", "waiting");
  const el = add("card", "");
  // Any agent can raise its hand, so the card says which one is asking.
  el.innerHTML = (f.agent ? "<div class='who'>" + esc(f.agent) + " is asking</div>" : "") +
    "<div class='prompt'>" + esc(f.prompt) + "</div>" +
    (f.detail ? "<div class='detail'>" + esc(f.detail) + "</div>" : "");
  // A free-text question needs somewhere to type: ask_human defaults to this
  // kind, so without it the most common question has no answer path at all.
  let box = null;
  if (f.ui && f.ui.kind === "text") {
    box = document.createElement("textarea");
    box.className = "answer";
    box.rows = 2;
    el.appendChild(box);
  }
  for (const opt of (f.ui && f.ui.options) || []) {
    el.appendChild(optionButton(f, opt, box));
  }
  cards.set(f.pending_id, el);
}

// One button on a pending card. The page names an option; the server owns the
// body that actually reaches the agent.
function optionButton(f, opt, box) {
  const b = document.createElement("button");
  b.textContent = opt.label;
  if (opt.tone === "bad") b.className = "bad";
  if (opt.tone === "warn") b.className = "warn";
  b.onclick = async () => {
    if (opt.opens && f.ui.url) window.open(f.ui.url, "_blank", "noopener");
    if (opt.opens && b.textContent === opt.label) { b.textContent = "done, carry on"; opt.opens = false; return; }
    // The page ships the typed content; the server still owns the body shape.
    await post("/api/pending/" + encodeURIComponent(f.pending_id),
      { id: VM, option: opt.id, text: box ? box.value : "" });
  };
  return b;
}

// Grey out a card once anyone answers it, on any device.
function renderResolved(f) {
  const el = cards.get(f.pending_id);
  if (!el) return;
  el.classList.add("done");
  el.querySelectorAll("button").forEach((b) => (b.disabled = true));
  cards.delete(f.pending_id);
  setState("idle", "idle");
}

// POST JSON to our own API.
async function post(path, body) {
  try {
    const r = await fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (r.status === 401) location.href = "/login?next=" + encodeURIComponent(location.pathname + location.search);
    return r.ok;
  } catch { return false; }
}

// Show a banner with optional action buttons.
function showBanner(html, actions) {
  banner.innerHTML = html;
  for (const a of actions || []) {
    const b = document.createElement("button");
    b.textContent = a.label;
    b.onclick = a.run;
    banner.appendChild(b);
  }
  banner.classList.add("show");
}

// Hide the banner.
function hideBanner() { banner.classList.remove("show"); banner.innerHTML = ""; }

// Offer the running VMs as links, for a missing or absent id.
async function listVMs(prefix) {
  const r = await fetch("/api/vms");
  const d = r.ok ? await r.json() : { vms: [] };
  const links = (d.vms || []).map((v) =>
    "<a href='/chat?id=" + encodeURIComponent(v.id) + "'>" + esc(v.id) + "</a> <span style='color:var(--dim)'>" +
    esc(v.state) + "</span>").join(" &nbsp; ");
  showBanner(prefix + (links ? "<div style='margin-top:6px'>" + links + "</div>"
    : "<div style='margin-top:6px;color:var(--dim)'>no VMs are running</div>"), []);
}

// Decide what to do about the target VM before streaming anything.
async function checkTarget() {
  const r = await fetch("/api/target?id=" + encodeURIComponent(VM));
  const d = r.ok ? await r.json() : { status: "unreachable" };
  $("vm").textContent = VM || "";
  return handleTarget(d);
}

// Map a target status onto a banner and whether to keep trying.
function handleTarget(d) {
  if (d.status === "ready") { hideBanner(); return true; }
  if (d.status === "none") { listVMs("<b>Pick a VM.</b>"); return stop(); }
  if (d.status === "missing") { listVMs("<b>No VM named " + esc(VM) + ".</b>"); return stop(); }
  if (d.status === "paused") {
    showBanner("<b>" + esc(VM) + "</b> is paused. ",
      [{ label: "resume", run: async () => { await post("/api/resume", { id: VM }); boot(); } }]);
    return false;
  }
  showBanner("<b>" + esc(VM) + "</b> is starting…", []);
  return false;
}

// Stop retrying: a typo or an empty id will never resolve itself.
function stop() { stopped = true; setState("not connected", "bad"); $("send").disabled = true; return false; }

// Open the stream. EventSource reconnects and resends Last-Event-ID for free.
function connect() {
  es = new EventSource("/api/stream?id=" + encodeURIComponent(VM));
  es.addEventListener("frame", (e) => {
    errSince = 0;
    hideBanner();
    try { render(JSON.parse(e.data)); } catch {}
  });
  es.onopen = () => { errSince = 0; if (!working) setState("idle", "idle"); };
  es.onerror = () => {
    if (!errSince) errSince = Date.now();
    // Only complain if it stays broken: a blink should not flash a banner.
    if (Date.now() - errSince > 3000) setState("reconnecting", "warn");
  };
}

// Resolve the target, then stream. Retries while the VM is merely starting.
async function boot() {
  if (stopped) return;
  if (await checkTarget()) { connect(); return; }
  if (!stopped) setTimeout(boot, 2000);
}

// Send the composed message.
async function submit() {
  const t = $("text").value.trim();
  if (!t || working || stopped) return;
  $("text").value = "";
  $("text").style.height = "auto";
  if (!(await post("/api/send", { id: VM, text: t }))) add("err", "could not reach the agent");
}

$("send").onclick = submit;
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
$("text").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});
boot();
</script>
</body>
</html>
